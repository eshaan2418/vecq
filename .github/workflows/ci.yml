name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # arm64: NEON kernels
          - os: ubuntu-24.04-arm    # arm64 Linux: NEON kernels
          - os: ubuntu-latest       # x86-64: portable kernels only
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Build
        env:
          CXX: clang++
        run: make build CMAKE_FLAGS="-DVECQ_WERROR=ON"
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4
      - name: Smoke-test CLI
        run: |
          ./build/vecq-gen 100000 > smoke.csv
          ./build/vecq smoke.csv "SELECT payment, COUNT(*), AVG(fare) FROM t GROUP BY payment ORDER BY payment"

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address-undefined, thread]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Relax ASLR for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build
        env:
          CXX: clang++
        run: |
          SAN=$(echo ${{ matrix.sanitizer }} | tr - ,)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DVECQ_SANITIZE=$SAN -DVECQ_BUILD_BENCH=OFF
          cmake --build build -j4
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build/vecq_tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make lint
